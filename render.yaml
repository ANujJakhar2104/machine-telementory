# Render Blueprint – https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sm-telemetry-portal
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      - key: DB_PATH
        value: data/telemetry.db
      - key: SEED_DEMO_USERS
        value: "true"
